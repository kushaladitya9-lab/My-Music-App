<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="cover.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Music App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>Vibe Music</h1>
        </header>

        <!-- Scrollable Playlist -->
        <div class="playlist" id="playlist">
            <!-- Playlist items will be generated by JavaScript -->
        </div>

        <!-- Floating Mini Player (Bottom Bar) -->
        <div class="mini-player" id="mini-player">
            <div class="song-info">
                <img src="cover.jpg" id="cover" alt="Cover">
                <div class="text">
                    <h4 id="title">Track 1</h4>
                    <p id="artist">My Favorite Artist</p>
                </div>
            </div>
            <div class="controls">
                <button id="prev"><i class="fa-solid fa-backward-step"></i></button>
                <button id="play"><i class="fa-solid fa-play" id="play-icon"></i></button>
                <button id="next"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <audio id="audio" src="song1.mp3"></audio>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
